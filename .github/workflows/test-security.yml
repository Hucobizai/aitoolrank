name: Test Website Security

on:
  workflow_dispatch:

jobs:
  test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run security tests
        run: python bot/test_safe_fetch.py
