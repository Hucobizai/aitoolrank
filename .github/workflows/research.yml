
name: Research new AI tool releases

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python bot/research.py
      - run: python bot/build.py
      - run: cp site/tools.json docs/tools.json
      - name: Commit pending candidates
        run: |
          git config user.name 'aitoolrank-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/review_queue.json site/tools.json docs/tools.json
          if ! git diff --cached --quiet; then git commit -m 'Update research review queue'; git push; fi
